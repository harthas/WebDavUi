name: Check and build IPK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and shell syntax
        run: |
          node --check root/www/luci-static/resources/view/webdavui/config.js
          for file in install.sh uninstall.sh scripts/postinst scripts/prerm root/etc/init.d/webdavui root/etc/hotplug.d/block/95-webdavui root/usr/libexec/webdavui-config root/usr/libexec/webdavui-move root/usr/libexec/rpcd/webdavui; do
            sh -n "$file"
          done
      - name: Build architecture-independent IPK
        run: node scripts/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: WebDavUi-IPK
          path: dist/*.ipk
